[workspace]
resolver = "3"
members = [
    "crates/axiom-cli",
    "crates/axiom-core",
    "crates/axiom-diagnostics",
    "crates/axiom-check",
    "crates/axiom-format",
    "crates/axiom-lint",
]

[workspace.package]
version = "0.5.0"
edition = "2024"

[workspace.dependencies]
blake3 = "1.8.5"
clap = { version = "4.6.5", features = ["derive", "env"] }
dotenvy = "0.15.7"
glob = "0.3.4"
jsonschema = "0.28"
memmap2 = "0.9"
miette = { version = "7", features = ["fancy"] }
owo-colors = { version = "4", features = ["supports-colors"] }
rkyv = { version = "0.8", features = ["bytecheck", "std"] }
schemars = { version = "0.8", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlparser = "0.62.0"
thiserror = "2"
tokio = { version = "1.53.1", features = ["full"] }
tokio-postgres = "0.7.18"
winnow = "0.7"
regex = "1"
