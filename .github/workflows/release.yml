name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Generate JSON schema (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p schemas
          "target/${{ matrix.target }}/release/axiom" schema > schemas/axiom.schema.json

      - name: Generate JSON schema (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path schemas | Out-Null
          & "target/${{ matrix.target }}/release/axiom.exe" schema | Out-File -Encoding ascii schemas/axiom.schema.json

      - name: Package Linux archive and checksum
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/axiom" dist/axiom
          tar -C dist -czf "axiom-v${{ github.ref_name }}-${{ matrix.target }}.tar.gz" axiom
          sha256sum "axiom-v${{ github.ref_name }}-${{ matrix.target }}.tar.gz" > "axiom-v${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256"

      - name: Package Windows archive and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "axiom-v${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive -Force -Path "target/${{ matrix.target }}/release/axiom.exe" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            axiom-v${{ github.ref_name }}-${{ matrix.target }}.*
            schemas/axiom.schema.json
