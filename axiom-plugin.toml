name = "axiom"
type = "cli"

[platform.linux]
exe-path = "axiom"
checksum-file = "axiom-v{version}-x86_64-unknown-linux-gnu.tar.gz.sha256"
download-file = "axiom-v{version}-x86_64-unknown-linux-gnu.tar.gz"

[platform.windows]
exe-path = "axiom.exe"
checksum-file = "axiom-v{version}-x86_64-pc-windows-msvc.zip.sha256"
download-file = "axiom-v{version}-x86_64-pc-windows-msvc.zip"

[install]
checksum-url = "https://github.com/FlowUp-Official/axiom/releases/download/v{version}/{checksum_file}"
download-url = "https://github.com/FlowUp-Official/axiom/releases/download/v{version}/{download_file}"

[install.exes.axiom]
exe-path = "axiom"
primary = true

[resolve]
git-url = "https://github.com/FlowUp-Official/axiom"
